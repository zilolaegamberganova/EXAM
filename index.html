<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard-board</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="header-card">
        <h1>Flashcard board</h1>
        <p>Write a task select a color, and add it as a card</p>

        <form class="form">
            <input class="text" type="text" placeholder="create a card">
            <select class="color-select">
                <option value="red">Red</option>
                <option value="yellow">Yellow</option>
                <option value="blue">Blue</option>
                <option value="brown">Brown</option>
            </select>
            <button type="submit" class="add-btn">Add card</button>
        </form>

        <div class="progress-container">
            <p class="progress-text" id="progress-text">0 of 0 tasks accomplished (0%)</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <div class="board">
        <div class="zone" id="todo">
            <div class="zone-header">
                <h3>Todo</h3>
                <span class="count">0</span>
            </div>
            <div class="cards-container"></div>
        </div>

        <div class="zone" id="important">
            <div class="zone-header">
                <h3>Important</h3>
                <span class="count">0</span>
            </div>
            <div class="cards-container"></div>
        </div>

        <div class="zone" id="accomplished">
            <div class="zone-header">
                <h3>Accomplished</h3>
                <span class="count">0</span>
            </div>
            <div class="cards-container"></div>
        </div>

        <div class="zone" id="trash">
            <div class="zone-header">
                <h3>Trash</h3>
                <span class="count">0</span>
            </div>
            <div class="cards-container trash-drop-zone">
                <div class="trash-content">
                    <span class="trash-icon">&#128465;</span>
                    <p class="trash-text">Deleted: <span id="delete-count">0</span></p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
